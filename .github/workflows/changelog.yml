name: Changelog

# ponytail: minimal workflow; update changelog on push to main via stdlib AI script
on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update CHANGELOG.md
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          python3 scripts/changelog.py --push "${{ github.event.before }}..${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs(changelog): update CHANGELOG.md [skip ci]" && git push)
