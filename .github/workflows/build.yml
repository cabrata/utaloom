name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb createDistributable
          - os: windows-latest
            task: packageMsi createDistributable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install VLC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y vlc-bin vlc-plugin-base libvlc5
      - name: Install VLC and WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { "$($_.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          $vlcInstalled = $false
          for ($i = 1; $i -le 3; $i++) {
            choco install vlc --yes --no-progress
            if ($LASTEXITCODE -eq 0) { $vlcInstalled = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $vlcInstalled) {
            $installer = "$env:TEMP\vlc-installer.exe"
            Invoke-WebRequest -Uri "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.exe" -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          }
      - name: Test
        timeout-minutes: 15
        shell: bash
        env:
          UTALOOM_WM_ARTIFACTS: ${{ github.workspace }}/app/build/acceptance/fullscreen
        run: bash ./gradlew :shared:jvmTest :app:test :app:playerSmoke --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-${{ runner.os }}
          path: app/build/acceptance/fullscreen
          if-no-files-found: ignore
      - name: Package
        shell: bash
        run: |
          for t in ${{ matrix.task }}; do bash ./gradlew ":app:$t" --no-daemon; done
      - name: Verify Windows MSI and Bundled App
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .github/scripts/verify-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: utaloom-${{ runner.os }}
          path: |
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/msi/*.msi
            app/build/compose/binaries/main/app/**
            app/build/acceptance/**
          if-no-files-found: warn
