name: Release

# Automatic production release: bump appVersion in gradle.properties and push to main.
# If tag v<appVersion> doesn't exist yet, this builds deb/rpm/msi with that version and publishes
# a GitHub release (creating the tag), which the in-app update check picks up.
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')
          # MSI and deb need a plain MAJOR.MINOR.PATCH version.
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::appVersion must look like 1.2.3, got '$v'"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            task: packageReleaseDeb packageReleaseRpm
          - os: windows-latest
            task: packageReleaseMsi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Without libVLC, vlcj recursively scans the runner's directories during audio tests.
      - name: Install VLC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y vlc-bin vlc-plugin-base libvlc5
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { "$($_.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Test
        timeout-minutes: 15
        shell: bash
        run: bash ./gradlew :shared:jvmTest :app:test --no-daemon
      - name: Package
        shell: bash
        run: for t in ${{ matrix.task }}; do bash ./gradlew ":app:$t" --no-daemon; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            app/build/compose/binaries/main-release/deb/*.deb
            app/build/compose/binaries/main-release/rpm/*.rpm
            app/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate AI Changelog & Release Notes
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if ! python3 scripts/changelog.py --release "$TAG" --output release-notes.md; then
            echo "AI changelog failed; falling back to the raw commit list."
            { echo "## What's Changed"; git log -n 20 --pretty='- %s (%h)'; } > release-notes.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "docs(changelog): update CHANGELOG.md for $TAG [skip ci]" && git push)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Utaloom ${{ needs.version.outputs.tag }}
          files: dist/**/*
          body_path: release-notes.md
          make_latest: true
